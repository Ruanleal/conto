name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extensao:
    name: Extensão (regras em Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Baixar org.json
        run: curl -fsSL -o json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar

      - name: Testar as regras
        run: |
          javac -encoding UTF-8 -d build/regras -cp json.jar \
            extension/src/com/conto/notificacoes/Regras.java \
            extension/test/com/conto/notificacoes/TesteRegras.java
          java -cp build/regras:json.jar com.conto.notificacoes.TesteRegras

      - name: Teste de mutação das regras
        run: JSON_JAR="$PWD/json.jar" python3 extension/mutar_regras.py

  ferramentas:
    name: Ferramentas (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compilar os scripts
        run: python -m py_compile tools/*.py extension/*.py
